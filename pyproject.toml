[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1sim"
version = "0.2.0"
description = "Live current-season Formula 1 Monte Carlo simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]
web = [
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/f1sim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["src"]
