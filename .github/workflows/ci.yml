name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[web,dev]'

      - name: Lint
        run: ruff check src examples tests

      - name: Test
        run: pytest -q

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep this image version aligned with the npm package below. Preinstalled
    # browsers avoid apt updates against unrelated repositories on the runner.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application and browser dependencies
        run: |
          python -m pip install -e '.[web,dev]'
          npm install --prefix output/browser-deps --no-audit --no-fund playwright@1.58.2
      - name: Offline dashboard smoke
        env:
          F1SIM_OFFLINE: "1"
          NODE_PATH: ${{ github.workspace }}/output/browser-deps/node_modules
        run: node tests/browser_dashboard.cjs
      - name: Offline HTML export checks
        env:
          NODE_PATH: ${{ github.workspace }}/output/browser-deps/node_modules
        run: node tests/browser_html_exports.cjs
